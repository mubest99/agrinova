<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriNova · Ethiopian Crop Map</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- D3.js for data-driven visualization -->
    <script src="https://d3js.org/d3.v7.min.js">
    </script>

    <style>
        /* ========== AgriNova Design System ========== */
        :root {
            --forest: #164A2A;
            --agri-green: #2E7D32;
            --fresh-green: #66BB6A;
            --harvest-gold: #D9A441;
            --cream: #F7F4EA;
            --white: #FFFFFF;
            --charcoal: #26332A;
            --shadow: 0 8px 30px rgba(22, 74, 42, 0.15);
            --radius: 12px;
            --transition: 0.25s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--cream);
            color: var(--charcoal);
            line-height: 1.5;
        }

        /* ========== Page Shell ========== */
        .cropmap-page {
            max-width: 1440px;
            margin: 0 auto;
            padding: 1.5rem 2rem 2rem;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ========== Header ========== */
        .map-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            padding-bottom: 1rem;
            border-bottom: 2px solid rgba(22, 74, 42, 0.10);
            margin-bottom: 1.25rem;
        }

        .map-header-left {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            gap: 0.5rem 1rem;
        }

        .logo-cursive {
            font-family: 'Georgia', serif;
            font-size: 1.9rem;
            font-weight: 700;
            font-style: italic;
            color: var(--forest);
            letter-spacing: -0.5px;
        }
        .logo-cursive span {
            color: var(--harvest-gold);
            font-weight: 400;
        }

        .map-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--charcoal);
            letter-spacing: -0.3px;
        }
        .map-title small {
            font-weight: 400;
            font-size: 0.95rem;
            color: #4a5a4e;
            display: inline-block;
            margin-left: 0.5rem;
        }

        .map-subtitle {
            font-size: 0.95rem;
            color: #4a5a4e;
            margin-top: 0.2rem;
            max-width: 700px;
        }

        /* ========== Controls Bar ========== */
        .controls-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.75rem 1rem;
            margin: 1rem 0 1.25rem;
            padding: 0.75rem 1rem;
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .search-wrap {
            flex: 2 1 260px;
            display: flex;
            align-items: center;
            background: var(--cream);
            border-radius: 40px;
            padding: 0 1rem;
            border: 1px solid #dde3df;
            transition: border var(--transition);
        }
        .search-wrap:focus-within {
            border-color: var(--agri-green);
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.15);
        }
        .search-wrap input {
            border: none;
            background: transparent;
            padding: 0.65rem 0.5rem;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            color: var(--charcoal);
        }
        .search-wrap input::placeholder {
            color: #889e92;
        }
        .search-wrap .search-icon {
            color: #6f8a7c;
            font-size: 1.2rem;
            line-height: 1;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            border: 1px solid transparent;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--cream);
            color: var(--charcoal);
            border-color: #d0d9d3;
            text-decoration: none;
        }
        .btn:hover {
            background: var(--agri-green);
            color: var(--white);
            border-color: var(--agri-green);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.25);
        }
        .btn-primary {
            background: var(--forest);
            color: var(--white);
            border-color: var(--forest);
        }
        .btn-primary:hover {
            background: #1d5f34;
            border-color: #1d5f34;
        }
        .btn-outline {
            background: transparent;
            border-color: var(--agri-green);
            color: var(--agri-green);
        }
        .btn-outline:hover {
            background: var(--agri-green);
            color: var(--white);
        }
        .btn-sm {
            padding: 0.35rem 0.85rem;
            font-size: 0.8rem;
        }

        .btn.active-layer {
            background: var(--forest);
            color: var(--white);
            border-color: var(--forest);
        }

        /* ========== Main Layout: Map + Panel ========== */
        .map-panel-grid {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 1.5rem;
            flex: 1;
            min-height: 580px;
        }

        .map-container {
            position: relative;
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            min-height: 500px;
        }
        #ethiopiaMap {
            width: 100%;
            height: 100%;
            min-height: 500px;
        }

        /* Leaflet overrides */
        .leaflet-control-zoom a {
            background: var(--white) !important;
            color: var(--charcoal) !important;
            border-color: #d0d9d3 !important;
        }
        .leaflet-control-zoom a:hover {
            background: var(--agri-green) !important;
            color: var(--white) !important;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        .leaflet-popup-content {
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--charcoal);
            font-size: 0.9rem;
            min-width: 180px;
        }
        .leaflet-popup-content strong {
            color: var(--forest);
        }

        /* ========== Info Panel ========== */
        .info-panel {
            background: var(--white);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 1.25rem 1.25rem 1rem;
            overflow-y: auto;
            max-height: 600px;
            transition: all var(--transition);
        }

        .info-panel .panel-empty {
            color: #6f8a7c;
            font-size: 0.95rem;
            text-align: center;
            padding: 2.5rem 0.5rem;
        }
        .info-panel .panel-empty .icon-big {
            font-size: 2.4rem;
            display: block;
            margin-bottom: 0.75rem;
            opacity: 0.5;
        }

        .info-panel h2 {
            font-size: 1.35rem;
            color: var(--forest);
            border-bottom: 2px solid var(--fresh-green);
            padding-bottom: 0.4rem;
            margin-bottom: 0.75rem;
            font-weight: 600;
        }
        .info-panel h3 {
            font-size: 1rem;
            color: var(--agri-green);
            margin-top: 0.9rem;
            margin-bottom: 0.3rem;
            font-weight: 600;
        }
        .info-panel .data-row {
            display: flex;
            justify-content: space-between;
            padding: 0.3rem 0;
            border-bottom: 1px solid #f0f3ef;
            font-size: 0.9rem;
        }
        .info-panel .data-row .label {
            color: #4a5a4e;
            font-weight: 500;
        }
        .info-panel .data-row .value {
            color: var(--charcoal);
            font-weight: 500;
            text-align: right;
            max-width: 60%;
        }
        .info-panel .data-row .value.unavailable {
            color: #b0beb5;
            font-style: italic;
            font-weight: 400;
        }

        .info-panel .source-note {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: #6f8a7c;
            border-top: 1px solid #e8edea;
            padding-top: 0.75rem;
            background: var(--cream);
            padding: 0.6rem 0.8rem;
            border-radius: 6px;
        }
        .info-panel .source-note strong {
            color: var(--forest);
        }

        .legend-box {
            margin-top: 1rem;
            padding: 0.75rem;
            background: var(--cream);
            border-radius: 8px;
            border-left: 4px solid var(--harvest-gold);
        }
        .legend-box h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #4a5a4e;
            margin-bottom: 0.4rem;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            padding: 0.15rem 0;
        }
        .legend-color {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            flex-shrink: 0;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        /* ========== Responsive ========== */
        @media (max-width: 992px) {
            .map-panel-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .info-panel {
                max-height: 380px;
            }
            .map-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.25rem;
            }
            .map-title small {
                display: block;
                margin-left: 0;
                font-size: 0.85rem;
            }
        }
        @media (max-width: 600px) {
            .cropmap-page {
                padding: 0.75rem;
            }
            .controls-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .btn-group {
                justify-content: center;
            }
            .map-title {
                font-size: 1.2rem;
            }
            .logo-cursive {
                font-size: 1.5rem;
            }
            #ethiopiaMap {
                min-height: 340px;
            }
            .info-panel {
                max-height: 300px;
                padding: 0.9rem;
            }
        }

        /* ========== Reset button special ========== */
        .btn-reset {
            background: transparent;
            color: #6f8a7c;
            border-color: #d0d9d3;
        }
        .btn-reset:hover {
            background: #d9534f;
            border-color: #d9534f;
            color: white;
        }

        /* small utility */
        .mt-1 {
            margin-top: 0.5rem;
        }
        .mb-1 {
            margin-bottom: 0.5rem;
        }
        .flex {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .gap-1 {
            gap: 0.5rem;
        }
        .text-muted {
            color: #6f8a7c;
            font-size: 0.85rem;
        }

        /* dominant production mini icons */
        .prod-icon {
            display: inline-block;
            width: 22px;
            height: 22px;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            vertical-align: middle;
        }
    </style>
</head>

    <div class="cropmap-page">

            <button class="btn btn-sm" data-layer="weather" id="layerWeather">Weather</button>
            <button class="btn btn-sm" data-layer="soil" id="layerSoil">Soil Type</button>
            <button class="btn btn-sm" data-layer="dominant" id="layerDominant">Dominant Production</button>
            <span style="flex:1;"></span>
            <span id="layerMeta" style="font-size:0.75rem; color:#6f8a7c;"></span>
        </div>

        <!-- ===== hidden container for search suggestions ===== -->
        <div id="suggestionsContainer" style="position:relative;"></div>
    </div>

        function getRegionStyle(feature, layerName) {
            const id = feature.id || feature.properties.regionId;

        // ================================================================

                geoLayer = L.geoJSON(ethiopiaGeoJSON, {
                    style: function(feature) {
                        return getRegionStyle(feature, layerType);

                    onEachFeature: function(feature, layer) {
                        const id = feature.id || feature.properties.regionId;
                        const data = regionDataById[id];
                        if (data) {
                            layer.bindPopup(`

        // ================================================================
        //  DOMINANT PRODUCTION LAYER
        // ================================================================

        function applyDominantLayer() {
            const cropColors = {
                'Teff': '#D9A441',
                'Maize': '#F5C842',
                'Sorghum': '#C49A6C',
                'Wheat': '#E8C87A',
                'Coffee': '#6F4E37',
                'Sesame': '#F0E0B0',
                'Enset': '#8CB87A',
                'Khat': '#7BA05B',
                'Horticulture': '#66BB6A',
                'Urban Horticulture': '#66BB6A',
                'Vegetables': '#7CB87A'
            };

            const defaultCropColor = '#A8B5A0';

            // Add markers/symbols for dominant crops — we'll use small circle markers
            // with custom colors and a subtle icon representation.
            // For a production implementation, use actual SVG icons.
            // Here we use colored circles with a label.

            const overlayFeatures = [];

            ethiopiaGeoJSON.features.forEach(f => {
                const id = f.id || f.properties.regionId;
                const data = regionDataById[id];
                if (!data) return;
                const crop = dominantCropMap[id] || 'Unknown';
                const color = cropColors[crop] || defaultCropColor;
                // Get centroid of the polygon (approximate)
                const coords = f.geometry.coordinates[0];
                let latSum = 0,
                    lngSum = 0,
                    count = 0;
                coords.forEach(c => {
                    lngSum += c[0];
                    latSum += c[1];
                    count++;
                });
                const centerLat = latSum / count;
                const centerLng = lngSum / count;

                overlayFeatures.push({ lat: centerLat, lng: centerLng, crop: crop, color: color, regionId: id });
            });

            // Create a group for the symbols
            const symbolGroup = L.layerGroup();

            overlayFeatures.forEach(f => {
                // Circle with color
                const circle = L.circleMarker([f.lat, f.lng], {
                    radius: 18,
                    fillColor: f.color,
                    color: '#26332A',
                    weight: 1.5,
                    opacity: 0.9,
                    fillOpacity: 0.85
                }).addTo(symbolGroup);

                // Add a small text label (crop initial)
                const label = L.marker([f.lat, f.lng], {
                    icon: L.divIcon({
                        className: 'dominant-label',
                        html: `<div style="font-size:10px; font-weight:700; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,0.5); text-align:center; line-height:1.2; pointer-events:none; width:30px;">${f.crop.substring(0,3)}</div>`,
                        iconSize: [30, 20],
                        iconAnchor: [15, 10]
                    }),
                    interactive: false
                }).addTo(symbolGroup);

                // Bind a popup
                const data = regionDataById[f.regionId];
                if (data) {
                    const popupContent = `
                        <strong>${data.name}</strong><br />
                        <span style="color:${f.color}; font-weight:600;">●</span> Dominant: ${f.crop}<br />
                        Production: ${data.production}<br />
                        Area: ${data.cultivatedArea}
                    `;
                    circle.bindPopup(popupContent);
                }
            });

            overlayLayer = symbolGroup;
            overlayLayer.addTo(map);

            // Also color the region polygons by dominant crop
            geoLayer.eachLayer(function(layer) {
                const id = layer.feature.id || layer.feature.properties.regionId;
                const crop = dominantCropMap[id] || 'Unknown';
                const color = cropColors[crop] || defaultCropColor;
                layer.setStyle({
                    fillColor: color,
                    fillOpacity: 0.35,
                    weight: 1.5,
                    color: '#26332A',
                    opacity: 0.7
                });
                if (selectedRegionId === id) {
                    layer.setStyle({
                        fillOpacity: 0.6,
                        weight: 3,
                        color: '#164A2A'
                    });
                }
            });

            document.getElementById('layerMeta').textContent = 'Dominant production • data: ESS 2025';
        }

        // ================================================================

        // ================================================================

        function applyWeatherLayer() {
            // Color by temperature (simplified)
            const tempColors = {
                'low': '#4A90D9',
                'med': '#66BB6A',
                'high': '#D9A441',
                'veryHigh': '#D9534F'
            };

            geoLayer.eachLayer(function(layer) {
                const id = layer.feature.id || layer.feature.properties.regionId;
                const data = regionDataById[id];
                if (!data) return;
                // Parse temp range
                let color = tempColors.med;
                if (data.temp) {
                    const temps = data.temp.match(/\d+/g);
                    if (temps) {
                        const avg = (parseInt(temps[0]) + parseInt(temps[1])) / 2;
                        if (avg < 18) color = tempColors.low;
                        else if (avg < 25) color = tempColors.med;
                        else if (avg < 30) color = tempColors.high;
                        else color = tempColors.veryHigh;
                    }
                }
                layer.setStyle({
                    fillColor: color,
                    fillOpacity: 0.65,
                    weight: 1.5,
                    color: '#26332A',
                    opacity: 0.6
                });
                if (selectedRegionId === id) {
                    layer.setStyle({
                        fillOpacity: 0.85,
                        weight: 3,
                        color: '#164A2A'
                    });
                }
            });

            document.getElementById('layerMeta').textContent = 'Temperature • data: EMI 2025';
        }

                    const color = soilColors[s] || '#C0C8B8';
                    legendHtml +=
                        `<div class="legend-item"><span class="legend-color" style="background:${color};"></span> ${s}</div>`;
                });
                legendHtml += `<div style="font-size:0.7rem;color:#6f8a7c;margin-top:0.4rem;">Data: EthioNSIS</div></div>`;
            } else if (layerType === 'weather') {
                legendHtml = `
                    <div class="legend-box"><h4>Temperature</h4>
                        <div class="legend-item"><span class="legend-color" style="background:#4A90D9;"></span> Cool (&lt;18°C)</div>
                        <div class="legend-item"><span class="legend-color" style="background:#66BB6A;"></span> Moderate (18-25°C)</div>
                        <div class="legend-item"><span class="legend-color" style="background:#D9A441;"></span> Warm (25-30°C)</div>
                        <div class="legend-item"><span class="legend-color" style="background:#D9534F;"></span> Hot (&gt;30°C)</div>
                        <div style="font-size:0.7rem;color:#6f8a7c;margin-top:0.4rem;">Data: EMI 2025</div>
                    </div>
                `;
            } else {
                legendHtml = `
                    <div class="legend-box"><h4>Ethiopia Regions</h4>
                        <div style="font-size:0.85rem;color:#4a5a4e;">Click any region to explore agricultural data.</div>
                        <div style="font-size:0.7rem;color:#6f8a7c;margin-top:0.4rem;">Boundaries: ESS • Data: MoA/ESS/EMI/ECX</div>
                    </div>
                `;
            }

            // Insert legend into panel if panel is empty or append
            const panelContent = document.getElementById('panelContent');
            if (panelContent.style.display === 'none') {
                // Show empty panel with legend
                const empty = document.getElementById('panelEmpty');
                empty.innerHTML = `
                    <div style="font-size:1.4rem;margin-bottom:0.5rem;">&#128220;</div>
                    <p><strong>Select a region or search for a crop</strong></p>
                    <div style="font-size:0.85rem;color:#6f8a7c;">Current layer: ${layerType.charAt(0).toUpperCase() + layerType.slice(1)}</div>
                    ${legendHtml}
                `;
                empty.style.display = 'block';
                panelContent.style.display = 'none';
            } else {
                // Append legend to existing content
                const existing = panelContent.innerHTML;
                // Check if legend already exists
                if (!existing.includes('legend-box')) {
                    panelContent.innerHTML = existing + legendHtml;
                }
            }
        }

        // ================================================================
        //  REGION SELECTION
        // ================================================================

        function selectRegion(regionId) {
            selectedRegionId = regionId;
            currentCrop = null;
            showRegionInfo(regionId);
            highlightRegion(regionId);
            // Update map style if needed
            if (geoLayer) {
                geoLayer.eachLayer(function(layer) {
                    const id = layer.feature.id || layer.feature.properties.regionId;
                    if (id === regionId) {
                        layer.setStyle(highlightStyle(layer.feature));
                    } else {
                        layer.setStyle(defaultStyle(layer.feature));
                    }
                });
            }
            // Fit bounds
            if (geoLayer) {
                let targetLayer = null;
                geoLayer.eachLayer(function(layer) {
                    const id = layer.feature.id || layer.feature.properties.regionId;
                    if (id === regionId) targetLayer = layer;
                });
                if (targetLayer) {
                    map.fitBounds(targetLayer.getBounds(), { padding: [40, 40], maxZoom: 7 });
                }
            }
            // Update search input
            const data = regionDataById[regionId];
            if (data) {
                document.getElementById('searchInput').value = data.name;
            }
        }

        function highlightRegion(regionId) {
            // Already handled in selectRegion
        }

        // ================================================================
        //  INFO PANEL
        // ================================================================

        function showRegionInfo(regionId) {
            const data = regionDataById[regionId];
            if (!data) return;

            const panelEmpty = document.getElementById('panelEmpty');
            panelEmpty.style.display = 'none';
            const panelContent = document.getElementById('panelContent');
            panelContent.style.display = 'block';

            let html = `
                <h2>${data.name}</h2>
                <div style="font-size:0.85rem;color:#4a5a4e;margin-bottom:0.5rem;">Capital: ${data.capital}</div>
                <div class="data-row"><span class="label">Elevation</span><span class="value">${data.elevation}</span></div>
                <div class="data-row"><span class="label">Climate</span><span class="value">${data.climate}</span></div>
                <div class="data-row"><span class="label">Coordinates</span><span class="value">${data.coords}</span></div>
                <h3>Soil</h3>
                <div class="data-row"><span class="label">Type</span><span class="value">${data.soil}</span></div>
                <div class="data-row"><span class="label">Characteristics</span><span class="value">${data.soilChars}</span></div>
                <div class="data-row"><span class="label">Suitability</span><span class="value">${data.soilSuitability}</span></div>
                <h3>Agriculture</h3>
                <div class="data-row"><span class="label">Primary Crop</span><span class="value">${data.primaryCrop}</span></div>
                <div class="data-row"><span class="label">Cultivated Area</span><span class="value">${data.cultivatedArea}</span></div>
                <div class="data-row"><span class="label">Production</span><span class="value">${data.production}</span></div>
                <div class="data-row"><span class="label">Yield</span><span class="value">${data.yield}</span></div>
                <div class="data-row"><span class="label">Season</span><span class="value">${data.season}</span></div>
                <h3>Weather</h3>
                <div class="data-row"><span class="label">Temperature</span><span class="value">${data.temp}</span></div>
                <div class="data-row"><span class="label">Rainfall</span><span class="value">${data.rainfall}</span></div>
                <div class="data-row"><span class="label">Humidity</span><span class="value">${data.humidity}</span></div>
                <div class="data-row"><span class="label">Drought Risk</span><span class="value">${data.droughtRisk}</span></div>
                <h3>Market</h3>
                <div class="data-row"><span class="label">Trading Hubs</span><span class="value">${data.marketHubs}</span></div>
                <div class="data-row"><span class="label">Target Markets</span><span class="value">${data.targetMarkets}</span></div>
                <div class="data-row"><span class="label">Trade Volume</span><span class="value">${data.tradeVolume}</span></div>
            `;

            // Dominant production
            const dominant = dominantCropMap[regionId] || 'Data unavailable';
            html += `
                <h3>Dominant Production</h3>
                <div class="data-row"><span class="label">Primary Product</span><span class="value" style="font-weight:700;color:var(--forest);">${dominant}</span></div>
            `;

            html += `
                <div class="source-note">
                    <strong>Data Sources:</strong> ESS, EthioNSIS, EMI, MoA, ECX<br />
                    Period: 2025 (various)
                </div>
            `;

            panelContent.innerHTML = html;
        }

        function showCropInfo(cropName) {
            const panelEmpty = document.getElementById('panelEmpty');
            panelEmpty.style.display = 'none';
            const panelContent = document.getElementById('panelContent');
            panelContent.style.display = 'block';

            // Find regions where this crop is primary
            const regions = REGIONS_DATA.filter(d =>
                d.primaryCrop.toLowerCase().includes(cropName.toLowerCase())
            );

            let html = `
                <h2>${cropName}</h2>
                <div style="font-size:0.9rem;color:#4a5a4e;margin-bottom:0.75rem;">
                    Found in ${regions.length} region${regions.length > 1 ? 's' : ''}
                </div>
            `;

            if (regions.length === 0) {
                html += `<div class="data-row"><span class="value unavailable">No documented production areas found.</span></div>`;
            } else {
                regions.forEach(d => {
                    html += `
                        <div style="background:var(--cream);padding:0.5rem 0.75rem;border-radius:6px;margin-bottom:0.5rem;border-left:3px solid var(--harvest-gold);">
                            <strong style="color:var(--forest);">${d.name}</strong>
                            <div class="data-row" style="border:none;padding:0.1rem 0;"><span class="label">Production</span><span class="value">${d.production}</span></div>
                            <div class="data-row" style="border:none;padding:0.1rem 0;"><span class="label">Area</span><span class="value">${d.cultivatedArea}</span></div>
                            <div class="data-row" style="border:none;padding:0.1rem 0;"><span class="label">Yield</span><span class="value">${d.yield}</span></div>
                            <div class="data-row" style="border:none;padding:0.1rem 0;"><span class="label">Season</span><span class="value">${d.season}</span></div>
                            <div style="font-size:0.8rem;color:#6f8a7c;margin-top:0.2rem;">
                                Markets: ${d.marketHubs} → ${d.targetMarkets}
                            </div>
                        </div>
                    `;
                });
            }

            html += `
                <div class="source-note">
                    <strong>Data Sources:</strong> ESS Agricultural Sample Survey, MoA<br />
                    Period: 2025
                </div>
            `;

            panelContent.innerHTML = html;
        }

        function showEmptyPanel() {
            const panelEmpty = document.getElementById('panelEmpty');
            panelEmpty.style.display = 'block';
            document.getElementById('panelContent').style.display = 'none';
            panelEmpty.innerHTML = `
                <div style="font-size:1.4rem;margin-bottom:0.5rem;">&#127758;</div>
                <p><strong>Select a region</strong><br />
                Search for a crop, or choose a map layer below.</p>
                <div style="margin-top:1rem; font-size:0.85rem; color:#889e92;">
                    &#9654; Click any region on the map<br />
                    &#9654; Use the layer buttons to explore
                </div>
            `;
        }

        // ================================================================
        //  SEARCH
        // ================================================================

        const searchInput = document.getElementById('searchInput');
        const suggestionsContainer = document.getElementById('suggestionsContainer');

        searchInput.addEventListener('input', function() {
            const query = this.value.trim().toLowerCase();
            if (query.length < 1) {
                clearSuggestions();
                return;
            }

            // Search regions
            const regionMatches = REGIONS_DATA.filter(d =>
                d.name.toLowerCase().includes(query) ||
                d.primaryCrop.toLowerCase().includes(query) ||
                d.capital.toLowerCase().includes(query)
            );

            // Search crops
            const cropMatches = CROP_LIST.filter(c =>
                c.toLowerCase().includes(query)
            );

            // Combine and deduplicate
            const results = [];
            const seen = new Set();

            regionMatches.forEach(d => {
                if (!seen.has(d.id)) {
                    seen.add(d.id);
                    results.push({ type: 'region', label: d.name, id: d.id, data: d });
                }
            });

            cropMatches.forEach(c => {
                if (!seen.has(c)) {
                    seen.add(c);
                    results.push({ type: 'crop', label: c, id: c });
                }
            });

            if (results.length === 0) {
                clearSuggestions();
                return;
            }

            showSuggestions(results);
        });

        function showSuggestions(results) {
            let html = `<div style="position:absolute;background:white;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,0.15);max-height:220px;overflow-y:auto;width:100%;z-index:999;padding:0.25rem 0;">`;
            results.forEach(r => {
                const icon = r.type === 'region' ? '📍' : '🌱';
                html += `
                    <div style="padding:0.5rem 0.8rem;cursor:pointer;border-bottom:1px solid #f0f3ef;display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;"
                         onmouseover="this.style.background='#f0f5ef'"
                         onmouseout="this.style.background='white'"
                         onclick="selectSearchResult('${r.type}', '${r.id}')">
                        <span>${icon}</span>
                        <span>${r.label}</span>
                        <span style="font-size:0.7rem;color:#6f8a7c;margin-left:auto;">${r.type}</span>
                    </div>
                `;
            });
            html += `</div>`;

            // Position relative to search input
            const rect = searchInput.getBoundingClientRect();
            const container = document.getElementById('suggestionsContainer');
            container.style.position = 'relative';
            container.innerHTML = html;
            const suggestionsDiv = container.querySelector('div');
            if (suggestionsDiv) {
                suggestionsDiv.style.position = 'absolute';
                suggestionsDiv.style.top = '0px';
                suggestionsDiv.style.left = '0px';
                suggestionsDiv.style.width = '100%';
                suggestionsDiv.style.maxWidth = '400px';
            }
        }

        function clearSuggestions() {
            document.getElementById('suggestionsContainer').innerHTML = '';
        }

        window.selectSearchResult = function(type, id) {
            clearSuggestions();
            document.getElementById('searchInput').blur();

            if (type === 'region') {
                selectRegion(id);
            } else if (type === 'crop') {
                currentCrop = id;
                selectedRegionId = null;
                showCropInfo(id);
                // Highlight regions where this crop is dominant/produced
                const regions = REGIONS_DATA.filter(d =>
                    d.primaryCrop.toLowerCase().includes(id.toLowerCase())
                );
                if (geoLayer) {
                    geoLayer.eachLayer(function(layer) {
                        const rid = layer.feature.id || layer.feature.properties.regionId;
                        const isMatch = regions.some(d => d.id === rid);
                        if (isMatch) {
                            layer.setStyle({
                                fillColor: '#D9A441',
                                fillOpacity: 0.7,
                                weight: 3,
                                color: '#164A2A'
                            });
                            layer.bringToFront();
                        } else {
                            layer.setStyle(defaultStyle(layer.feature));
                        }
                    });
                }
                // Fit to all matching regions
                if (geoLayer) {
                    const bounds = L.latLngBounds();
                    let hasBounds = false;
                    geoLayer.eachLayer(function(layer) {
                        const rid = layer.feature.id || layer.feature.properties.regionId;
                        if (regions.some(d => d.id === rid)) {
                            bounds.extend(layer.getBounds());
                            hasBounds = true;
                        }
                    });
                    if (hasBounds) {
                        map.fitBounds(bounds, { padding: [50, 50], maxZoom: 6 });
                    }
                }
                // Update search input
                document.getElementById('searchInput').value = id;
            }
        };

        // ================================================================
        //  LAYER SWITCHING
        // ================================================================

        document.querySelectorAll('[data-layer]').forEach(btn => {
            btn.addEventListener('click', function() {
                const layer = this.dataset.layer;
                currentLayer = layer;
                // Update active button
                document.querySelectorAll('[data-layer]').forEach(b => b.classList.remove('active-layer'));
                this.classList.add('active-layer');

                // If crop search is active, clear it
                if (layer !== 'default' && currentCrop) {
                    currentCrop = null;
                }

                renderMap(layer);

                // If switching to default, reset selection highlight
                if (layer === 'default' && selectedRegionId) {
                    selectRegion(selectedRegionId);
                } else if (layer === 'default') {
                    showEmptyPanel();
                }
            });
        });

        // ================================================================
        //  EXPLORE REGIONS BUTTON
        // ================================================================

        document.getElementById('exploreRegionsBtn').addEventListener('click', function() {
            // Reset to default layer and fit to Ethiopia
            document.querySelector('[data-layer="default"]').click();
            map.fitBounds([
                [3.0, 33.0],
                [15.0, 48.0]
            ]);
            document.getElementById('searchInput').value = '';
            currentCrop = null;
            selectedRegionId = null;
            showEmptyPanel();
            // Reset region styles
            if (geoLayer) {
                geoLayer.eachLayer(function(layer) {
                    layer.setStyle(defaultStyle(layer.feature));
                });
            }
        });

        // ================================================================
        //  CROP SEARCH BUTTON
        // ================================================================

        document.getElementById('cropSearchBtn').addEventListener('click', function() {
            document.getElementById('searchInput').focus();
            document.getElementById('searchInput').placeholder = 'Type a crop name...';
            setTimeout(() => {
                document.getElementById('searchInput').placeholder = 'Search crops, regions, or locations...';
            }, 3000);
        });

        // ================================================================
        //  RESET MAP
        // ================================================================

        document.getElementById('resetMapBtn').addEventListener('click', function() {
            // Reset everything
            document.querySelector('[data-layer="default"]').click();
            map.fitBounds([
                [3.0, 33.0],
                [15.0, 48.0]
            ]);
            document.getElementById('searchInput').value = '';
            currentCrop = null;
            selectedRegionId = null;
            showEmptyPanel();
            if (geoLayer) {
                geoLayer.eachLayer(function(layer) {
                    layer.setStyle(defaultStyle(layer.feature));
                });
            }
            // Clear any overlay
            if (overlayLayer) {
                map.removeLayer(overlayLayer);
                overlayLayer = null;
            }
            renderMap('default');
            document.getElementById('layerMeta').textContent = '';
        });

        // ================================================================
        //  KEYBOARD: Enter to search
        // ================================================================

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const query = this.value.trim();
                if (query.length > 0) {
                    // Try to find a region or crop match
                    const regionMatch = REGIONS_DATA.find(d =>
                        d.name.toLowerCase() === query.toLowerCase() ||
                        d.primaryCrop.toLowerCase().includes(query.toLowerCase())
                    );
                    if (regionMatch) {
                        selectSearchResult('region', regionMatch.id);
                        return;
                    }
                    const cropMatch = CROP_LIST.find(c =>
                        c.toLowerCase() === query.toLowerCase()
                    );
                    if (cropMatch) {
                        selectSearchResult('crop', cropMatch);
                        return;
                    }
                    // Partial match fallback
                    const partialRegion = REGIONS_DATA.find(d =>
                        d.name.toLowerCase().includes(query.toLowerCase()) ||
                        d.primaryCrop.toLowerCase().includes(query.toLowerCase())
                    );
                    if (partialRegion) {
                        selectSearchResult('region', partialRegion.id);
                    }
                }
                clearSuggestions();
            }
        });

        // Click outside to close suggestions
        document.addEventListener('click', function(e) {
            if (!e.target.closest('.search-wrap') && !e.target.closest('#suggestionsContainer')) {
                clearSuggestions();
            }
        });

        // ================================================================
        //  INIT
        // ================================================================

        // Show empty panel on load
        showEmptyPanel();

        // Render default map
        renderMap('default');

        // Fit to Ethiopia
        map.fitBounds([
            [3.0, 33.0],
            [15.0, 48.0]
        ]);

        // Log for developer
        console.log('AgriNova Ethiopian Crop Map initialized.');
        console.log(`Loaded ${REGIONS_DATA.length} regions.`);
        console.log('Data sources: ESS, EthioNSIS, EMI, MoA, ECX');

        // ================================================================
        //  RESPONSIVE: ensure map resizes
        // ================================================================

        window.addEventListener('resize', function() {
            map.invalidateSize();
        });
    </script>

</body>
</html>
